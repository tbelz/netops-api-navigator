name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Run tests
        run: uv run pytest -x --timeout=120
        env:
          # Suppress credential-dependent integration tests
          CENTRAL_BASE_URL: ""
          CENTRAL_CLIENT_ID: ""
          CENTRAL_CLIENT_SECRET: ""

  docker-v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build local Docker image
        run: docker build -t hpe-networking-central-mcp:ci .

      - name: Run v2 compiler smoke profile
        run: bash scripts/ci_docker_v2_smoke.sh hpe-networking-central-mcp:ci "${{ github.repository }}"

      - name: Run runtime hydration smoke profile
        run: bash scripts/ci_docker_runtime_hydration_smoke.sh hpe-networking-central-mcp:ci "${{ github.repository }}"
